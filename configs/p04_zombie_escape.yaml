project:
  id: p04_zombie_escape
  name: Zombie Escape
  authoritative: true
  viewer_question: "Who escapes best: Dijkstra, ML, or Deep Learning?"
  headline: "Zombie Escape: Dijkstra vs ML vs Deep Learning"
  supporting_message: "Optimization finds the best route for the costs it knows. Learning can help estimate the danger it cannot see."

experiment:
  city_representation: synthetic_downtown_inspired
  geographic_replica: false
  deterministic: true

  grid:
    rows: 36
    columns: 36
    movement: four_neighbor
    allow_diagonal: false
    step_distance: 1.0

  risk:
    minimum: 0.0
    maximum: 1.0
    high_risk_threshold: 0.65
    planner_risk_weight: 4.0
    true_risk_visible_to_headline_methods: false

  planner_cost:
    formula: "travel_time_cost + planner_risk_weight * estimated_risk"
    same_formula_for_all_headline_methods: true

  terrain:
    building:
      traversable: false
      speed_multiplier: 0.0

    local_road:
      traversable: true
      speed_multiplier: 1.0

    arterial:
      traversable: true
      speed_multiplier: 1.35

    slow_terrain:
      traversable: true
      speed_multiplier: 0.70

    open_space:
      traversable: true
      speed_multiplier: 0.85

cities:
  phoenix:
    display_name: "Phoenix Downtown"
    inspiration_only: true
    seed: 4203

    start:
      row: 31
      column: 4

    destination:
      row: 4
      column: 31

    profile:
      block_density: low
      intersection_density: low
      arterial_width: wide
      choke_point_density: low
      hidden_risk_structure: dispersed
      synthetic_barrier: none

  new_york:
    display_name: "New York Downtown"
    inspiration_only: true
    seed: 4201

    start:
      row: 33
      column: 2

    destination:
      row: 2
      column: 33

    profile:
      block_density: high
      intersection_density: high
      arterial_width: narrow
      choke_point_density: high
      hidden_risk_structure: strongly_clustered
      synthetic_barrier: none

  chicago:
    display_name: "Chicago Downtown"
    inspiration_only: true
    seed: 4202

    start:
      row: 32
      column: 3

    destination:
      row: 3
      column: 32

    profile:
      block_density: medium
      intersection_density: medium
      arterial_width: medium
      choke_point_density: high
      hidden_risk_structure: clustered
      synthetic_barrier: river_with_limited_bridges

methods:
  dijkstra:
    display_name: "Dijkstra"
    category: deterministic_baseline
    risk_estimator: observed_visible_risk
    route_planner: dijkstra
    sees_true_hidden_risk: false

  ml:
    display_name: "ML + A*"
    category: classical_machine_learning
    risk_estimator: gradient_boosting
    route_planner: astar
    sees_true_hidden_risk: false

  dl:
    display_name: "CNN + A*"
    category: deep_learning
    risk_estimator: convolutional_neural_network
    route_planner: astar
    sees_true_hidden_risk: false

oracle:
  enabled: true
  headline_contestant: false
  display_name: "Oracle"
  risk_estimator: true_hidden_risk
  route_planner: astar
  purpose: benchmark_regret_only

training:
  synthetic_training_cities: 2000
  synthetic_validation_cities: 400
  synthetic_benchmark_cities: 400

  showcase_cities_excluded_from_training: true

  seeds:
    training: 4301
    validation: 4302
    benchmark: 4303
    ml_model: 4304
    dl_model: 4305

  classical_ml:
    model_family: gradient_boosting

  deep_learning:
    model_family: small_cnn

evaluation:
  reported_route_metrics:
    - distance
    - travel_time
    - true_cumulative_risk
    - maximum_local_true_risk
    - high_risk_cells_crossed
    - route_valid
    - start
    - destination
    - oracle_risk_regret

  per_city_winner:
    direction: minimize
    lexicographic_order:
      - true_cumulative_risk
      - high_risk_cells_crossed
      - maximum_local_true_risk
      - travel_time
      - distance

    numeric_tolerance: 1.0e-9

    final_deterministic_tiebreak:
      - dijkstra
      - ml
      - dl

  overall_winner:
    direction: maximize_city_wins_then_minimize_metrics

    order:
      - city_wins_descending
      - mean_true_cumulative_risk_ascending
      - mean_high_risk_cells_crossed_ascending
      - mean_travel_time_ascending
      - mean_distance_ascending

    final_deterministic_tiebreak:
      - dijkstra
      - ml
      - dl

