  require_three_headline_methods: true
  require_distinct_city_profiles: true
  require_hidden_true_risk: true
  require_same_planner_cost_formula: true
  require_showcase_exclusion_from_training: true
  require_all_routes_valid: true
  require_oracle_regret: true
  require_computed_winner: true
  prohibit_hardcoded_winner: true
  require_exact_1080_square_video: true
  require_exact_1800_frames: true
  require_exact_60_seconds: true
  require_30_fps: true
  require_h264: true
  require_yuv420p: true
  require_visual_geometry_validation: true
  require_text_overlap_validation: true
  require_generated_outputs_untracked: true
