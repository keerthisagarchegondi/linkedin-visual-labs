project:
  project_id: "p02_monopoly_ai"
  project_name: "Monopoly AI Landlord Arena"
  project_number: 3

  technical_description: >-
    Autonomous rule-based strategy agents evaluated through
    Monte Carlo simulation in a simplified property-investment game.

  viewer_question: >-
    Four landlord strategies. 10,000 games. Which one survives?

  analytical_question: >-
    When four autonomous landlord strategies repeatedly allocate capital
    under uncertainty, which strategy wins most often, and what risk does
    it take to get there?

  disclaimer: >-
    Unofficial analytical simulation. Not affiliated with or endorsed
    by Hasbro.

intellectual_property:
  use_original_board_art: true
  use_original_property_names: true
  use_original_icons: true
  use_original_typography: true

  prohibited:
    - "Monopoly logo"
    - "Hasbro board artwork"
    - "official card artwork"
    - "official visual board design"
    - "official fonts"
    - "official player-token artwork"

  agent_description: "Autonomous rule-based strategy agents"

  prohibited_agent_description:
    - "reinforcement-learning agents"
    - "RL agents"

simulation:
  board_size: 40
  starting_cash: 1500
  go_salary: 200
  dice_count: 2
  die_sides: 6

  extra_turn_on_doubles: false
  three_doubles_to_jail: false

  maximum_turns: 500

  bank:
    unlimited_liquidity: true

  omitted_rules:
    - "property auctions"
    - "player-to-player trading"
    - "mortgages"
    - "hotels"
    - "human negotiation"
    - "reinforcement learning"
    - "house-rule variants"

