player_state_contract:
  fields:
    - "player_id"
    - "strategy_id"
    - "seat_index"
    - "cash"
    - "position"
    - "owned_asset_ids"
    - "jail_turns_remaining"
    - "bankrupt"
    - "bankruptcy_turn"
    - "total_rent_paid"
    - "total_rent_collected"
    - "minimum_cash_observed"

economy_contract:
  starting_cash: 1500

  cash_sources:
    - "starting cash"
    - "passing GO"
    - "positive event effects"
    - "rent received"

  cash_sinks:
    - "property purchases"
    - "house construction"
    - "taxes"
    - "negative event effects"
    - "rent paid"

  cash_transfers:
    rent:
      source: "tenant"
      destination: "owner"

  bank_is_counterparty_for:
    - "property purchases"
    - "house purchases"
    - "taxes"
    - "GO salary"
    - "event cash effects"

purchase_rules:
  purchasable_space_types:
    - "PROPERTY"
    - "TRANSIT"
    - "UTILITY"

  requirements:
    - "space is unowned"
    - "player is active"
    - "player has enough cash"
    - "strategy returns BUY"
    - "decision passes engine validation"

  auctions_enabled: false

ownership_rules:
  maximum_owners_per_asset: 1

  transferable_between_players:
    normal_play: false
    bankruptcy: true

  mortgages_enabled: false
  trading_enabled: false

group_completion_rules:
  complete_when: >-
    One active player owns every PROPERTY asset in the group.

  transit_counts_as_group: false
  utility_counts_as_group: false

house_development_rules:
  enabled: true

  eligibility:
    - "player owns complete property group"
    - "property is in that complete group"
    - "player is not bankrupt"
    - "player can afford house cost"
    - "strategy returns BUILD"
    - "build preserves even-development rule"

  maximum_houses_per_property: 4

  hotels_enabled: false

  even_development_rule: >-
    After a build action, the maximum house-count difference between
    any two properties in the same group may not exceed one.

cash_reserve_contract:
  definition: >-
    Strategy-specific minimum desired post-decision cash balance.

  enforcement: >-
    Reserve targets guide strategy decisions but are not enforced by
    the game engine. The engine enforces only legality and affordability.

jail_contract:
  jail_space_index: 10

  entry_sources:
    - "GO_TO_JAIL board space"
    - "GO_TO_JAIL event"

  behavior:
    skipped_turns: 1
    cash_fine: 0
    doubles_release: false

  release: >-
    The jailed player skips exactly one scheduled turn and is then
    automatically released.

bankruptcy_contract:
  trigger: >-
    A player is bankrupt when a required payment exceeds available cash.

  asset_liquidation_or_mortgage: false

  player_becomes_inactive_immediately: true

  creditor_policy:
    rent_bankruptcy: "transfer owned assets to creditor"
    bank_bankruptcy: "return owned assets to bank"

  houses_on_transferred_assets: >-
    Houses remain attached to transferred properties when bankruptcy
    occurs against another player.

  houses_on_bank_return: >-
    Houses are removed when assets return to the bank.

turn_sequence:
  - "START_TURN"
  - "CHECK_JAIL"
  - "ROLL_DICE"
  - "MOVE"
  - "APPLY_PASS_GO"
  - "RESOLVE_LANDING"
  - "RESOLVE_REQUIRED_PAYMENT"
  - "REQUEST_PURCHASE_DECISION_IF_ELIGIBLE"
  - "APPLY_PURCHASE_DECISION"
  - "REQUEST_BUILD_DECISIONS"
  - "APPLY_VALID_BUILD_DECISIONS"
  - "CHECK_BANKRUPTCY"
  - "END_TURN"

game_phases:
  - "SETUP"
  - "ACTIVE"
  - "TERMINATED_BANKRUPTCY"
  - "TERMINATED_TURN_LIMIT"

termination:
  maximum_turns: 500

  natural_termination:
    active_players_remaining: 1

  turn_limit_resolution:
    enabled: true
# ============================================================================
# Project 3 — Step 1 — Sub-steps 1.26–1.50
# ============================================================================

winner_determination:
  natural_termination:
    condition: "exactly one active player remains"
    winner: "sole active player"
    winner_position: 1
    compare_net_worth: false

  terminal_net_worth:
    formula: >-
      Cash plus original purchase value of all currently owned assets
      plus historical construction cost of all houses currently attached
      to those owned properties.

    components:
      - "cash"
      - "owned_asset_purchase_value"
      - "house_investment_value"

    asset_valuation:
      PROPERTY: "configured purchase price"
      TRANSIT: "configured purchase price"
      UTILITY: "configured purchase price"

    house_valuation: "configured construction cost"

    speculative_resale_value: false

  turn_limit:
    condition: "maximum turn count reached with multiple active players"
    eligible_for_win: "active players only"
    primary_score: "terminal_net_worth"
    highest_score_wins: true


tie_breaking:
  active_player_order:
    - "terminal_net_worth_desc"
    - "cash_desc"
    - "total_rent_collected_desc"
    - "completed_color_groups_desc"
    - "owned_purchasable_assets_desc"
    - "seeded_tie_break_rank"

  bankrupt_player_order:
    primary: "bankruptcy_turn_desc"
    secondary: "bankruptcy_event_index_desc"
    final: "seeded_tie_break_rank"

  prohibited_fallbacks:
    - "seat_index"
    - "strategy_name_lexical_order"
    - "iteration_order"

  seeded_tie_break:
    algorithm: "SHA-256"
    stream_label: "tie_break"
    scope: "per game"
    deterministic: true


bankruptcy_settlement_contract:
  mandatory_payment_exceeds_cash:
    transfer_available_cash: true
    bankrupt_player_final_cash: 0
    unpaid_balance_is_forgiven: true

  rationale: >-
    Mortgages, emergency asset sales, loans, and negotiation are omitted.
    The bankrupt player transfers all available cash and then follows
    the deterministic asset-transfer rules defined in the bankruptcy
    contract.


event_log_contract:
  ordering:
    field: "event_index"
    starts_at: 0
    monotonic: true
    contiguous: true

  required_fields:
    - "game_id"
    - "event_index"
    - "turn_number"
    - "event_type"
    - "player_id"
    - "strategy_id"
    - "seat_index"
    - "position_before"
    - "position_after"
    - "cash_before"
    - "cash_after"
    - "asset_id"
    - "counterparty_player_id"
    - "amount"
    - "metadata"

  nullable_fields:
    - "player_id"
    - "strategy_id"
    - "seat_index"
    - "position_before"
    - "position_after"
    - "cash_before"
    - "cash_after"
    - "asset_id"
    - "counterparty_player_id"
    - "amount"

  event_types:
    - "GAME_SETUP"
    - "TURN_START"
    - "JAIL_SKIP"
    - "DICE_ROLL"
    - "MOVE"
    - "PASS_GO"
    - "EVENT_DRAW"
    - "CASH_TRANSFER"
    - "PURCHASE_DECISION"
    - "ASSET_PURCHASED"
    - "BUILD_DECISION"
    - "HOUSE_BUILT"
    - "RENT_DUE"
    - "BANKRUPTCY"
    - "ASSET_TRANSFER"
    - "TURN_END"
    - "GAME_END"

  replay_requirements:
    deterministic_order: true
    representative_game_video_source: true
    human_readable_metadata: true


seed_contract:
  algorithm: "SHA-256"
  namespace: "p02-monopoly-ai"

  integer_encoding:
    bytes: 8
    byte_order: "big"
    unsigned: true

  game_seed_derivation: >-
    SHA256(namespace + ":" + master_seed + ":" + game_index),
    interpreted from the first 8 digest bytes as an unsigned
    big-endian integer.

  random_streams:
    - "dice"
    - "chance"
    - "community"
    - "tie_break"

  stream_seed_derivation: >-
    SHA256(namespace + ":" + game_seed + ":" + stream_label),
    interpreted from the first 8 digest bytes as an unsigned
    big-endian integer.

  requirements:
    python_hash_forbidden: true
    same_seed_same_game: true
    stream_isolation_required: true


tournament_seed_contract:
  canonical_master_seed: 73031
  canonical_game_count: 10000

  game_index_start: 0
  game_index_end_exclusive: 10000

  unique_game_seeds_required: true

  reproducibility:
    same_master_seed_same_tournament: true
    different_master_seed_changes_game_seeds: true


strategies:
  canonical_order:
    - "collector"
    - "specialist"
    - "cash_protector"
    - "aggressive_builder"

  seat_rotation:
    cycle_length: 8

    assignments:
      - ["collector", "specialist", "cash_protector", "aggressive_builder"]
      - ["specialist", "cash_protector", "aggressive_builder", "collector"]
      - ["cash_protector", "aggressive_builder", "collector", "specialist"]
      - ["aggressive_builder", "collector", "specialist", "cash_protector"]

      - ["collector", "aggressive_builder", "cash_protector", "specialist"]
      - ["aggressive_builder", "cash_protector", "specialist", "collector"]
      - ["cash_protector", "specialist", "collector", "aggressive_builder"]
      - ["specialist", "collector", "aggressive_builder", "cash_protector"]

    canonical_tournament_expected_games_per_strategy: 10000
    canonical_tournament_expected_games_per_strategy_per_seat: 2500

  policies:
    collector:
      label: "Collector"

      objective: >-
        Maximize portfolio breadth by buying most legal assets that
        remain affordable while keeping only a small cash reserve.

      desired_cash_reserve: 150
      development_cash_reserve: 200

      purchase:
        breadth_priority: true
        preferred_property_groups: []
        buy_transit: true
        buy_utility: true
        monopoly_completion_bonus: "moderate"

      development:
        enabled: true
        intensity: "moderate"
        maximum_builds_per_turn: 1

    specialist:
      label: "Specialist"

      objective: >-
        Concentrate capital in selected color groups and prioritize
        completion of strategically preferred monopolies.

      desired_cash_reserve: 350
      development_cash_reserve: 400

      purchase:
        primary_property_groups:
          - "G4"
          - "G5"
          - "G6"

        secondary_property_groups:
          - "G3"
          - "G7"

        low_priority_property_groups:
          - "G1"
          - "G2"
          - "G8"

        buy_transit: "selective"
        buy_utility: "selective"
        monopoly_completion_bonus: "very_high"

      development:
        enabled: true
        intensity: "focused"
        maximum_builds_per_turn: 2

    cash_protector:
      label: "Cash Protector"

      objective: >-
        Preserve liquidity, avoid unnecessary bankruptcy risk,
        purchase selectively, and develop only with substantial
        post-decision cash reserves.

      desired_cash_reserve: 600
      development_cash_reserve: 750

      purchase:
        breadth_priority: false
        selectivity: "high"
        buy_transit: "selective"
        buy_utility: "selective"
        monopoly_completion_bonus: "moderate"

      development:
        enabled: true
        intensity: "cautious"
        maximum_builds_per_turn: 1

    aggressive_builder:
      label: "Aggressive Builder"

      objective: >-
        Prioritize group completion and deploy capital rapidly into
        houses while accepting substantially higher liquidity risk.

      desired_cash_reserve: 75
      development_cash_reserve: 75

      purchase:
        breadth_priority: false
        monopoly_completion_bonus: "extreme"
        buy_transit: true
        buy_utility: true

      development:
        enabled: true
        intensity: "aggressive"
        maximum_builds_per_turn: 4


strategy_decision_contract:
  legal_actions:
    - "BUY"
    - "PASS"
    - "BUILD"
    - "HOLD_CASH"

  purchase_phase_actions:
    - "BUY"
    - "PASS"

  development_phase_actions:
    - "BUILD"
    - "HOLD_CASH"

  required_decision_fields:
    - "action"
    - "reason_code"

  optional_decision_fields:
    - "asset_id"
    - "property_id"

  policy_state_access: "read_only"

  policy_mutation_of_game_state: false


engine_decision_validation:
  authority: "game_engine"

  invalid_decision_behavior:
    silently_coerce: false
    raise_domain_error: true
    log_invalid_decision: true

  purchase_validation:
    - "action valid for purchase phase"
    - "target asset exists"
    - "target asset is purchasable"
    - "target asset is unowned"
    - "player is active"
    - "player has enough cash"

  build_validation:
    - "action valid for development phase"
    - "target property exists"
    - "player owns target property"
    - "player owns complete target color group"
    - "player is active"
    - "player can afford house"
    - "property is below maximum house count"
    - "build preserves even-development rule"

  hold_validation:
    - "HOLD_CASH valid only in development phase"

  pass_validation:
    - "PASS valid only in purchase phase"


metrics:
  primary:
    tournament_win_rate:
      numerator: "games won by strategy"
      denominator: "completed tournament games"
      higher_is_better: true
      unit: "proportion"

  bankruptcy_rate:
    numerator: "games in which strategy becomes bankrupt"
    denominator: "completed tournament games"
    lower_is_better: true
    unit: "proportion"

  median_finishing_cash:
    population: "all completed games for strategy"
    bankrupt_finishing_cash: 0
    statistic: "median"
    higher_is_better: true
    unit: "currency"

  finishing_position_distribution:
    positions:
      - 1
      - 2
      - 3
      - 4

    ranking_contract:
      active_players: "winner/tie-break ranking"
      bankrupt_players: "later bankruptcy ranks higher"
      active_players_always_rank_above_bankrupt_players: true

  property_acquisition:
    fields:
      - "assets_acquired_total"
      - "color_properties_acquired"
      - "transit_assets_acquired"
      - "utility_assets_acquired"
      - "assets_owned_at_finish"

  group_completion:
    fields:
      - "groups_completed_during_game"
      - "groups_owned_complete_at_finish"
      - "first_group_completion_turn"

    nullable:
      - "first_group_completion_turn"

  house_development:
    fields:
      - "houses_built_total"
      - "houses_owned_at_finish"
      - "first_house_build_turn"

    nullable:
      - "first_house_build_turn"

  rent:
    fields:
      - "total_rent_paid"
      - "total_rent_collected"
      - "net_rent"

    net_rent_formula: "total_rent_collected - total_rent_paid"

  cash_reserve:
    fields:
      - "minimum_cash_observed"
      - "median_end_of_turn_cash"
      - "mean_end_of_turn_cash"
      - "turns_below_strategy_desired_reserve"

    reserve_breach_definition: >-
      End-of-turn cash is below the strategy's configured desired
      cash reserve while the player remains active.

  game_length:
    fields:
      - "turns_played"
      - "termination_reason"

    tournament_statistics:
      - "mean_turns"
      - "median_turns"
      - "turn_limit_resolution_rate"


confidence_intervals:
  confidence_level: 0.95

  binomial_proportions:
    method: "Wilson score interval"
    z_value: 1.959963984540054

    applies_to:
      - "tournament_win_rate"
      - "bankruptcy_rate"

  formula_contract:
    center: >-
      (p_hat + z^2/(2n)) / (1 + z^2/n)

    half_width: >-
      z * sqrt((p_hat*(1-p_hat)/n) + (z^2/(4*n^2)))
      / (1 + z^2/n)

  clipping:
    minimum: 0.0
    maximum: 1.0

  median_finishing_cash:
    headline_confidence_interval_required: false

  deterministic_calculation: true
# ============================================================================
# Project 3 — Step 1 — Sub-steps 1.51–1.68
# ============================================================================

pairwise_comparison_contract:
  canonical_pairs:
    - ["collector", "specialist"]
    - ["collector", "cash_protector"]
    - ["collector", "aggressive_builder"]
    - ["specialist", "cash_protector"]
    - ["specialist", "aggressive_builder"]
    - ["cash_protector", "aggressive_builder"]

  primary_metric:
    name: "head_to_head_superiority_rate"
    numerator: "games where strategy_a finishes above strategy_b"
    denominator: "games containing both strategies"
    canonical_denominator: 10000
    null_value: 0.5

  descriptive_differences:
    - "win_rate_difference"
    - "bankruptcy_rate_difference"
    - "median_finishing_cash_difference"

  inferential_test:
    method: "two-sided exact binomial test"
    null_hypothesis: "head_to_head_superiority_rate = 0.5"
    family_wise_alpha: 0.05
    multiple_comparison_correction: "Holm"
    comparison_count: 6

  interpretation:
    numerical_leader_allowed: true
    statistically_supported_advantage_requires_adjusted_p_below_alpha: true
    statistical_tie_label_when_not_supported: true


fairness_acceptance:
  hard_gates:
    completed_games_exact: 10000
    strategy_game_records_exact: 40000
    strategies_per_game_exact: 4
    appearances_per_strategy_exact: 10000
    appearances_per_strategy_per_seat_exact: 2500
    distinct_seats_per_game_exact: 4
    winners_per_game_exact: 1
    finishing_positions_per_game_exact: 4
    impossible_ownership_states_allowed: 0
    illegal_house_states_allowed: 0
    unresolved_games_allowed: 0
    win_rate_sum_target: 1.0
    win_rate_sum_absolute_tolerance: 1.0e-12
    reproducibility_hash_match_required: true

  seat_effect_diagnostics:
    overall_seat_win_rate_spread_max: 0.05
    within_strategy_seat_win_rate_spread_max: 0.10

  interpretation: >-
    Exact seat exposure is the primary fairness control. Excessive
    empirical seat effects trigger investigation even though every
    strategy receives identical seat exposure.


