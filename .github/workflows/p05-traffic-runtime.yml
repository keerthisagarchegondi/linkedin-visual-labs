name: Project 6 optional CPU runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Python 3.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install isolated optional runtime and development tools
        run: python -m pip install --editable ".[dev,traffic-cv]" --constraint configs/p05_traffic_operations_early_warning/runtime_constraints.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Project 6 deterministic tests
        run: python -B -m pytest tests/projects/p05_traffic_operations_early_warning
      - name: Validate configuration and CPU imports without inference
        run: |
          python -B -m linkedin_visual_labs traffic config-check --repository-root "$GITHUB_WORKSPACE" --json
          python -B -m linkedin_visual_labs traffic doctor --repository-root "$GITHUB_WORKSPACE" --check-imports --require-runtime --json
