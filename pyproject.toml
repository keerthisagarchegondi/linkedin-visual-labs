[build-system]
requires = [
  "setuptools>=75",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-visual-labs"
version = "0.1.0"
description = "Visual machine-learning, simulation, optimization, NLP, audio, and computer-vision experiments."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
  { name = "Keerthi Sagar Chegondi" },
]
dependencies = [
  "imageio>=2.36",
  "imageio-ffmpeg>=0.5",
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "pillow>=11.0",
  "plotly>=5.24",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "rich>=13.9",
  "scipy>=1.14",
  "typer>=0.12",
    "scikit-learn>=1.6",
    "pyarrow>=18",
    "joblib>=1.4",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
linkedin-visual-labs = "linkedin_visual_labs.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [
  "src",
]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=linkedin_visual_labs",
  "--cov-report=term-missing",
]
testpaths = [
  "tests",
]

[tool.coverage.run]
branch = true
source = [
  "linkedin_visual_labs",
]

[tool.ruff]
line-length = 100
src = [
  "src",
  "tests",
]
target-version = "py313"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = [
  "src",
  "tests",
]
